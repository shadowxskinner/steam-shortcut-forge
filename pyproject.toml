[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
dynamic = ["version"]
description = "Automatic launcher artwork for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shadow Skinner" },
]
keywords = ["linux", "kde", "gnome", "desktop", "icons", "artwork", "launcher", "steam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
# The .desktop file and the PKGBUILD both say Exec=kairo, so the command has
# to exist. Without this the packaged app installed fine and then had nothing
# to launch.
kairo = "kairo.qt.__main__:main"

[project.optional-dependencies]
# The two frontends. Neither is required by the other, and the backend needs
# neither: providers, artwork, the ledger, migration and matching are all
# toolkit-free and their tests run with no GUI library installed at all.
tk = ["customtkinter>=6.0.0", "cairosvg"]
qt = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/shadowxskinner/kairo"
Repository = "https://github.com/shadowxskinner/kairo"
Issues = "https://github.com/shadowxskinner/kairo/issues"

[project.gui-scripts]
kairo = "kairo.__main__:main"
kairo-qt = "kairo.qt.__main__:main"

[tool.setuptools.dynamic]
# Single source of truth. Nothing else stores a version string.
version = { attr = "kairo.__version__" }

[tool.setuptools.packages.find]
include = ["kairo*"]

[tool.setuptools.package-data]
# The blur shim is built, not shipped prebuilt: it is optional, and a compiled
# object has no business in a wheel that must also work without it.
"kairo.qt" = ["native/*.c", "native/build.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
