[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
dynamic = ["version"]
description = "Automatic launcher artwork for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shadow Skinner" },
]
keywords = ["linux", "kde", "gnome", "desktop", "icons", "artwork", "launcher", "steam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=10.0.0",
    "PySide6>=6.6",
]

[project.scripts]
# The desktop file, package and documentation all use the Qt application.
# Keep the legacy frontend explicit so installers never have two entry-point
# groups racing to create a different executable at the same path.
kairo = "kairo.qt.__main__:main"
kairo-qt = "kairo.qt.__main__:main"
kairo-tk = "kairo.__main__:main"

[project.optional-dependencies]
# The Qt frontend is the shipping application and therefore a normal runtime
# dependency. The previous Tk frontend remains available for comparison.
tk = ["customtkinter>=6.0.0", "cairosvg"]

[project.urls]
Homepage = "https://github.com/shadowxskinner/kairo"
Repository = "https://github.com/shadowxskinner/kairo"
Issues = "https://github.com/shadowxskinner/kairo/issues"

[tool.setuptools.dynamic]
# Single source of truth. Nothing else stores a version string.
version = { attr = "kairo.__version__" }

[tool.setuptools.packages.find]
include = ["kairo*"]

[tool.setuptools.package-data]
# The blur shim is built, not shipped prebuilt: it is optional, and a compiled
# object has no business in a wheel that must also work without it.
"kairo.qt" = ["native/*.c", "native/build.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
