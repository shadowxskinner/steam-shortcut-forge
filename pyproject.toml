[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
dynamic = ["version"]
description = "Automatic launcher artwork for Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shadow Skinner" },
]
keywords = ["linux", "kde", "gnome", "desktop", "icons", "artwork", "launcher", "steam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "customtkinter>=6.0.0",
    "Pillow>=10.0.0",
    "cairosvg",
]

[project.urls]
Homepage = "https://github.com/shadowxskinner/kairo"
Repository = "https://github.com/shadowxskinner/kairo"
Issues = "https://github.com/shadowxskinner/kairo/issues"

[project.gui-scripts]
kairo = "kairo.__main__:main"

[tool.setuptools.dynamic]
# Single source of truth. Nothing else stores a version string.
version = { attr = "kairo.__version__" }

[tool.setuptools.packages.find]
include = ["kairo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
